# Cổng kiểm RIÊNG của nhánh `tuantran`.
#
# Vì sao khoanh theo nhánh (08/09/2026): nhóm chốt ai làm nấy tự kiểm rồi tự đẩy
# prod, nên không có cổng chung ở `main`. File này chỉ chạy khi đẩy lên nhánh
# `tuantran` — GitHub đọc workflow theo NHÁNH của cú push, nên nhánh của người
# khác không bao giờ kích hoạt nó và cũng không thấy lượt chạy đỏ nào.
#
# Nó tự co giãn theo quyền hiện có:
# Cần ĐÚNG một secret: `GHCR_TOKEN`. Gói Zalo `@zero-126/*` nằm ở
# npm.pkg.github.com, mà `pnpm install` tải nó kể cả khi lọc `--filter
# ./apps/seller...` (đã thử trên runner thật ngày 08/09/2026: `ERR_PNPM_FETCH_401`;
# lần thử ở máy dev qua được chỉ vì store cục bộ có sẵn gói). Nói cách khác
# KHÔNG có khoá thì không kiểm được gì thật, nên thiếu secret là báo rồi dừng —
# thà không kiểm còn hơn xanh giả. Thêm secret cần quyền admin repo.
name: CI (tuantran)

on:
  push:
    branches: [tuantran]
  workflow_dispatch:

concurrency:
  group: ci-tuantran
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Bám ĐÚNG bộ công cụ của repo: `packageManager` ghim pnpm 8.6.10 và
      # lockfile là v6 — dùng pnpm 9 sẽ đòi viết lại lockfile ngay bước cài.
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.10
      # KHÔNG bật `cache: pnpm`: khi thiếu khoá thì không có bước cài nào chạy,
      # thư mục store không tồn tại và bước dọn của action tự đánh hỏng cả job
      # ("Path Validation Error") — job đáng lẽ chỉ cảnh báo lại thành đỏ.
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Xác định phạm vi kiểm
        id: scope
        run: |
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Có GHCR_TOKEN → kiểm toàn workspace."
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Bỏ qua toàn bộ phép kiểm: thiếu secret GHCR_TOKEN. Thêm ở Settings → Secrets and variables → Actions (cần quyền admin repo) rồi chạy lại."
          fi

      # ── Có khoá: kiểm đầy đủ ─────────────────────────────────────────
      - name: Cài toàn workspace
        if: steps.scope.outputs.full == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Build shared + core (đầy đủ)
        if: steps.scope.outputs.full == 'true'
        run: pnpm --filter shared build && pnpm --filter core build
      - name: Type-check toàn workspace
        if: steps.scope.outputs.full == 'true'
        run: pnpm build-types
      - name: Lint
        if: steps.scope.outputs.full == 'true'
        run: pnpm lint
      - name: Test apps/api
        if: steps.scope.outputs.full == 'true'
        run: pnpm --filter ./apps/api test
