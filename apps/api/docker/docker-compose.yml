services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    ports:
      - ${RABBITMQ_AMQP_PORT}:5672
      - ${RABBITMQ_WEB_PORT}:15672
    volumes:
      - ${RABBITMQ_DATA_PATH}:/var/lib/rabbitmq/
      - ${RABBITMQ_LOG_PATH}:/var/log/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    networks:
      - onosfactory

  redis:
    image: redis:alpine
    container_name: 'redis'
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ${REDIS_DATA_PATH}:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DATABASE=${REDIS_DB}
    entrypoint: ['sh', '-c', 'redis-server --requirepass $$REDIS_PASSWORD']
    networks:
      - onosfactory

  mongodb:
    image: mongo:6.0
    container_name: 'onosfactory-mongodb'
    # Hostname CO DINH: cau hinh replica set luu thanh vien theo hostname. Tao lai
    # container ma hostname doi -> 'not a member of it' -> app khong doc/ghi duoc.
    hostname: onosfactory-mongodb
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - ~/.docker-conf/mongodb/data:/data/db
    # Tran bo dem WiredTiger. Mac dinh = 50% RAM may -> tren may hub 64 GB no phinh
    # toi 8 GB cho mot DB dev 700 MB. 2 GB la du, tra RAM cho cac du an khac.
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--wiredTigerCacheSizeGB', '2']
    networks:
      - onosfactory

networks:
  onosfactory:
    driver: bridge
