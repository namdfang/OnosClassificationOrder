# Tunnel onos tren may hub.
#
# Dinh tuyen THEO DUONG DAN tren cung 1 ten mien:
#   <domain>/api/*  -> API   (localhost:3007, global prefix la /api/v1)
#   <domain>/*      -> Web   (localhost:5173, ban build tinh)
#
# Vi sao: ban build cua web goi API bang duong dan TUONG DOI (/api/v1/...),
# khac ban dev (tu suy ra api-<sub>.<domain>). Gop chung 1 ten mien thi:
#   - mot ban build chay duoc tren MOI ten mien, khong phai build lai khi doi domain
#   - cung nguon goc nen khong con van de CORS
# Thu tu ingress co y nghia: luat /api phai dung TRUOC luat bat tat ca.

tunnel: e9a56d70-758a-4494-9a00-85dccddd18ac
credentials-file: /root/.vibedev/repos/onos/cloudflared/e9a56d70-758a-4494-9a00-85dccddd18ac.json

ingress:
  # --- ten mien chinh (production tam thoi) ---
  - hostname: onosfactory.com
    path: ^/api
    service: http://localhost:3007
  - hostname: onosfactory.com
    service: http://localhost:5173

  - hostname: www.onosfactory.com
    path: ^/api
    service: http://localhost:3007
  - hostname: www.onosfactory.com
    service: http://localhost:5173

  # --- giu ten mien cu de khong dut trong luc chuyen ---
  - hostname: dev-onos.autonow.vn
    path: ^/api
    service: http://localhost:3007
  - hostname: dev-onos.autonow.vn
    service: http://localhost:5173

  # --- API rieng: script/cron va Public Order API cua khach van goi duoc ---
  - hostname: api.onosfactory.com
    service: http://localhost:3007
  - hostname: api-dev-onos.autonow.vn
    service: http://localhost:3007

  - service: http_status:404
